<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Săn sale hong nè 💖⚡</title>
<meta name="description" content="Gom deal xinh mỗi ngày, bấm link là có giá tốt liền.">
<meta property="og:title" content="Săn sale hong nè 💖⚡"><meta property="og:description" content="Gom deal xinh mỗi ngày, bấm link là có giá tốt liền.">
<meta name="theme-color" content="#FFD3E2">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F8E4F0;--bg2:#D9EBFB;--ink:#3D2C4D;--soft:#7C6A8C;--pink:#F6D3E6;--pink-d:#E8A5CC;--blue:#CDE4FA;--blue-d:#93C1EC;--card:#ffffffcc;--blob1:#f2c4e0;--blob2:#b9d9f6;
--serif:"DM Serif Display",Georgia,serif;--sans:"Quicksand","Trebuchet MS",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2036;--bg2:#1F2A3F;--ink:#FCEFF5;--soft:#C9B8D8;--card:#3A2E4acc;--blob1:#6b3a5e;--blob2:#2f4f7a}}
:root[data-theme="dark"]{--bg:#2A2036;--bg2:#1F2A3F;--ink:#FCEFF5;--soft:#C9B8D8;--card:#3A2E4acc;--blob1:#6b3a5e;--blob2:#2f4f7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink);background:linear-gradient(160deg,var(--bg),#ECE4F8 48%,var(--bg2));background-attachment:fixed;display:flex;justify-content:center;overflow-x:hidden;position:relative}
.blob{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(60px);opacity:.7;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.b1{background:var(--blob1);top:-80px;left:-90px}.b2{background:var(--blob2);bottom:-100px;right:-90px;animation-delay:-7s}
@keyframes drift{to{transform:translate(70px,90px) scale(1.2)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fx i{position:absolute;bottom:-30px;font-style:normal;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:440px;padding:32px 18px 52px;text-align:center}
.avatar{position:relative;width:124px;height:124px;margin:0 auto 14px}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#F59CBC,#8FBFF2,#fff,#F59CBC,#8FBFF2,#F59CBC);animation:spin 5s linear infinite;filter:drop-shadow(0 0 10px #f59cbc99)}
.avatar img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;display:block;border:4px solid #fff;animation:bob 3.4s ease-in-out infinite}
.avatar s{position:absolute;text-decoration:none;font-size:20px;animation:twinkle 1.8s ease-in-out infinite}
.avatar s:nth-of-type(1){top:-8px;right:-6px}.avatar s:nth-of-type(2){bottom:6px;left:-14px;animation-delay:-.6s;font-size:15px}.avatar s:nth-of-type(3){top:22px;left:-20px;animation-delay:-1.2s;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1.2) rotate(30deg);opacity:1}}
h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:0 0 6px;background:linear-gradient(100deg,#e0508a,#6aa7ea,#f59cbc,#e0508a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:250% 0}}
.bio{margin:0 auto 14px;max-width:300px;color:var(--soft);font-weight:600;font-size:15px;line-height:1.5}
.ticker{overflow:hidden;margin:0 -18px 20px;padding:8px 0;background:linear-gradient(90deg,#e9a8cf,#9cc6ee,#e9a8cf);color:#fff;font-weight:700;font-size:14px;transform:rotate(-1.5deg);box-shadow:0 6px 16px #f59cbc55}
.ticker div{display:flex;width:max-content;animation:run 16s linear infinite}
.ticker span{padding:0 14px;white-space:nowrap}
@keyframes run{to{transform:translateX(-50%)}}
.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.socials a,.share{padding:10px 18px;border-radius:999px;background:var(--card);border:2px solid #fff;color:var(--ink);text-decoration:none;font:700 14px var(--sans);cursor:pointer;transition:transform .2s,background .2s}
.socials a:hover,.share:hover{transform:translateY(-2px) scale(1.04);background:var(--pink)}
.links{display:grid;gap:18px}
.card{position:relative;display:block;height:190px;border-radius:28px;overflow:hidden;text-decoration:none;color:#fff;text-align:left;border:3px solid #fff;background:linear-gradient(135deg,#f6d3e6,#cde4fa);box-shadow:0 10px 26px #f59cbc55;transition:transform .25s;isolation:isolate}
.card:nth-child(even){box-shadow:0 10px 26px #8fbff277}
.card:hover{transform:translateY(-4px) scale(1.025) rotate(-.6deg)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:kb 9s ease-in-out infinite alternate}
.card:nth-child(even) img{animation-direction:alternate-reverse}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-2%,-2%)}}
.card::before{content:"";position:absolute;inset:0;z-index:-1}
.card:nth-child(odd)::before{background:linear-gradient(180deg,#f59cbc00 35%,#d9648fdd 100%)}
.card:nth-child(even)::before{background:linear-gradient(180deg,#8fbff200 35%,#4a86c9dd 100%)}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffffaa,transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
.card:nth-child(2)::after{animation-delay:1.4s}.card:nth-child(3)::after{animation-delay:2.8s}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.hot{position:absolute;top:12px;right:12px;padding:5px 12px;border-radius:999px;background:#fff;color:#e0508a;font-weight:700;font-size:12px;animation:wig 2s ease-in-out infinite;box-shadow:0 3px 10px #0002}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
.info{position:absolute;left:0;right:0;bottom:0;padding:16px 18px}
.card b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;text-shadow:0 1px 6px #0006}
.cta{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:#fff;color:#d9648f;font-size:13px;font-weight:700;animation:pulse 1.8s ease-in-out infinite}
.card:nth-child(even) .cta{color:#4a86c9}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffffffcc}50%{box-shadow:0 0 0 9px #ffffff00}}
a:focus-visible,.share:focus-visible{outline:3px solid var(--blue-d);outline-offset:3px}
footer{margin-top:30px;font-size:13px;color:var(--soft);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fx{display:none}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="fx" id="fx" aria-hidden="true"></div>
<main>
<div class="avatar"><img alt="Săn sale hong nè" src="avatar.jpg"><s>✨</s><s>💖</s><s>⭐</s></div>
<h1>Săn sale hong nè💖⚡</h1>
<p class="bio">Gom deal xinh mỗi ngày, bấm link là có giá tốt liền.</p>
<div class="ticker" aria-hidden="true"><div id="tk"></div></div>
<nav class="socials" id="socials" aria-label="Mạng xã hội"></nav>
<div class="links" id="links"></div>
<footer>Link mới cập nhật thường xuyên ✨</footer>
</main>
<script src="deals.js"></script>
<script>
const tk="🔥 deal hot hôm nay ✨ giá tốt bấm liền 💖 săn sale cùng mình nè ⚡ ".repeat(2);
document.getElementById("tk").innerHTML=`<span>${tk}</span><span>${tk}</span>`;
const sv=socials.filter(x=>x.u&&x.u!=="#").map(x=>`<a href="${x.u}" target="_blank" rel="noopener">${x.n}</a>`);
sv.push('<button class="share" id="sh" type="button">Chia sẻ 💌</button>');
document.getElementById("socials").innerHTML=sv.join("");
document.getElementById("links").innerHTML=links.map(x=>`<a class="card" href="${x.u}" target="_blank" rel="noopener">${x.img?`<img alt="" src="${x.img}" onerror="this.remove()"${x.pos?` style="object-position:${x.pos}"`:""}>`:""}<span class="hot">HOT 🔥</span><div class="info"><b>${x.t}</b><span class="cta">${x.d} · bấm săn ngay ✨</span></div></a>`).join("");
document.getElementById("sh").onclick=async e=>{const b=e.currentTarget;try{if(navigator.share){await navigator.share({title:document.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);b.textContent="Đã copy link 💖"}}catch(_){}};
const fx=document.getElementById("fx"),em=["💖","✨","⭐","🎀","💗","🫧"];
for(let i=0;i<14;i++){const e=document.createElement("i");e.textContent=em[i%em.length];e.style.cssText=`left:${Math.random()*96}%;font-size:${12+Math.random()*14}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s`;fx.appendChild(e)}
</script></body></html>
